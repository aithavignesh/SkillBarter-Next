services:
  - type: web
    name: skillbarter-next-api
    runtime: node
    buildCommand: npm ci --no-audit --no-fund && npm run build -w shared && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWOFACTOR_API_KEY
        sync: false
