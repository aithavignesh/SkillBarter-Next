name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report dependency audit findings
        continue-on-error: true
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); const v=a.vulnerabilities||{}; console.log("Dependency audit summary:", JSON.stringify(a.metadata?.vulnerabilities||{})); for (const [name,item] of Object.entries(v)) console.log(JSON.stringify({name,severity:item.severity,isDirect:item.isDirect,range:item.range,fixAvailable:item.fixAvailable,via:item.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,range:x.range,url:x.url})}));'
      - run: npm run build -w shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
