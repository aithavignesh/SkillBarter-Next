name: Dependency audit remediation experiment

on:
  push:
    branches:
      - fix/audit-deps-2026-11-18

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply non-breaking npm audit fixes
        id: auditfix
        run: npm audit fix
        continue-on-error: true
      - name: Check remaining high and critical vulnerabilities
        id: audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Capture audit report
        run: npm audit --json > audit.json || true
      - name: Build shared workspace
        run: npm run build -w shared
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload dependency candidate and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-candidate
          path: |
            package.json
            package-lock.json
            frontend/package.json
            backend/package.json
            shared/package.json
            audit.json
      - name: Require security gate to pass
        if: always()
        run: |
          if [ "${{ steps.audit.outcome }}" != "success" ]; then
            echo "High/critical dependency audit still fails after non-breaking fixes."
            exit 1
          fi
