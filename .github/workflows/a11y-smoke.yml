name: Browser accessibility smoke

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  browser-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install browser audit tools
        run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build shared workspace
        run: npm run build -w shared
      - name: Build Next.js frontend
        run: npm run build -w frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Start production frontend
        shell: bash
        run: |
          set -euo pipefail
          NEXT_PUBLIC_API_URL=http://127.0.0.1:4000/api/v1 npm run start -w frontend -- --hostname 127.0.0.1 --port 3000 > /tmp/skillbarter-next-frontend.log 2>&1 &
          echo $! > /tmp/skillbarter-next-frontend.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/skillbarter-next-frontend.log
          exit 1
      - name: Audit routes at mobile, tablet, and desktop viewports
        run: node frontend/tests/a11y-smoke.mjs
        env:
          BASE_URL: http://127.0.0.1:3000
      - name: Upload frontend server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skillbarter-frontend-server-log
          path: /tmp/skillbarter-next-frontend.log

  staging-smoke:
    needs: browser-a11y
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI verification on this exact commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            checks="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs")"
            state="$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.name == "verify")] | sort_by(.started_at) | last | .conclusion // .status // "missing"')"
            if [ "$state" = "success" ]; then
              echo "CI verify passed for $GITHUB_SHA"
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "cancelled" ] || [ "$state" = "timed_out" ]; then
              echo "CI verify ended as $state for $GITHUB_SHA"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for CI verify on $GITHUB_SHA"
          exit 1

      - name: Verify Render staging is ready on this exact commit
        shell: bash
        env:
          STAGING_API_URL: https://skillbarter-next-api-staging.onrender.com
        run: |
          set -euo pipefail
          last_body=""
          for attempt in $(seq 1 45); do
            last_body="$(curl --fail --silent --show-error --max-time 10 "$STAGING_API_URL/api/v1/ready" 2>/dev/null || true)"
            if [ -n "$last_body" ] && printf '%s' "$last_body" | jq -e --arg sha "$GITHUB_SHA" '
              .status == "ready" and
              .database == "connected" and
              .commit == $sha and
              .branch == "development"
            ' >/dev/null 2>&1; then
              echo "Render staging is ready with MongoDB connected on $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Render staging did not report ready/database-connected for $GITHUB_SHA"
          printf '%s\n' "$last_body"
          exit 1

      - name: Verify Vercel preview is on this exact commit when frontend changed
        shell: bash
        env:
          WEB_PREVIEW_URL: https://skillbarter-next-preview-git-development-aithavignesh.vercel.app
        run: |
          set -euo pipefail
          if git diff --quiet "$GITHUB_SHA^" "$GITHUB_SHA" -- frontend; then
            echo "No frontend files changed in this commit; Vercel correctly skips a frontend rebuild."
            exit 0
          fi

          last_body=""
          for attempt in $(seq 1 45); do
            last_body="$(curl --fail --silent --show-error --max-time 10 "$WEB_PREVIEW_URL/api/build-info" 2>/dev/null || true)"
            if [ -n "$last_body" ] && printf '%s' "$last_body" | jq -e --arg sha "$GITHUB_SHA" '
              .service == "skillbarter-next-web" and
              .commit == $sha and
              .branch == "development"
            ' >/dev/null 2>&1; then
              echo "Vercel preview is serving frontend commit $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Vercel preview did not report frontend commit $GITHUB_SHA"
          printf '%s\n' "$last_body"
          exit 1
